<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel do dono · Rota Comercial</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<style>
:root{--bg:#F2F3F7;--surface:#fff;--ink:#141833;--muted:#646A8A;--line:#E2E4EE;--primary:#3346D3;--soft:#E8EBFF;--ok:#1A9E5C;--warn:#C98A00;--bad:#D93A3A;--acc:#F2B705;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:40px;--s7:48px;--s8:64px;--r1:8px;--r2:16px;--r3:24px;--pill:999px}
@media (prefers-color-scheme:dark){:root{--bg:#0C0F21;--surface:#151933;--ink:#EDEFFA;--muted:#959BBE;--line:#262C51;--primary:#8492FF;--soft:#1E2450}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:24px;background:var(--bg);color:var(--ink)}
main{max-width:1104px;margin:0 auto;padding:var(--s4) var(--s3) var(--s8);padding-top:max(var(--s4),env(safe-area-inset-top))}
header{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
header .grow{flex:1;min-width:0}
h1{font-size:24px;line-height:32px;margin:0;font-weight:900}
h2{font-size:20px;line-height:28px;margin:var(--s5) 0 var(--s2);font-weight:800}
.s{color:var(--muted);font-size:14px;line-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);min-height:48px;padding:0 var(--s3);border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.mini{min-height:40px;padding:0 var(--s3);font-size:14px;line-height:20px}
.btn.perigo{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s2)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3)}
.kpi b{display:block;font-size:32px;line-height:40px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.dest b{font-size:24px;line-height:40px}
.kpi.dest{background:var(--primary);border-color:var(--primary);color:#fff}.kpi.dest .s{color:#DDE2FF}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3)}
.esp+.esp{margin-top:var(--s3)}.esp-h{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}.esp-bar{height:16px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:var(--s2) 0 var(--s1)}
.esp-bar i{display:block;height:100%;border-radius:999px}.esp-bar i.ok{background:var(--ok)}.esp-bar i.warn{background:var(--warn)}.esp-bar i.bad{background:var(--bad)}b.warn{color:var(--warn)}b.bad{color:var(--bad)}
.esp-u{display:flex;justify-content:space-between;gap:var(--s2);font-size:14px;line-height:20px;padding:var(--s1) 0;border-top:1px solid var(--line)}.esp-u span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barras{display:flex;align-items:flex-end;gap:var(--s1);height:120px;margin-top:var(--s2)}
.barras i{flex:1;background:var(--primary);border-radius:var(--s1) var(--s1) 0 0;min-height:4px;position:relative}
.barras i.zero{background:var(--line)}
.eixo{display:flex;justify-content:space-between;margin-top:var(--s1)}
.filtros{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s2)}
.chip{min-height:40px;padding:0 var(--s3);border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;line-height:20px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=search]{width:100%;min-height:48px;border:1px solid var(--line);border-radius:var(--pill);padding:0 var(--s3);font:inherit;background:var(--surface);color:var(--ink);margin-bottom:var(--s2)}
.lista{display:grid;gap:var(--s2)}
.u{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3)}
.u-h{display:flex;gap:var(--s2);align-items:flex-start}
.u-h .grow{flex:1;min-width:0}
.u-h .t{font-weight:800;overflow-wrap:anywhere}
.tag{display:inline-block;border-radius:var(--pill);padding:0 var(--s2);font-size:12px;line-height:24px;font-weight:800;white-space:nowrap}
.tag.teste{background:var(--soft);color:var(--primary)}.tag.vencido{background:#FDE7E7;color:var(--bad)}.tag.pagante{background:#DDF5E8;color:var(--ok)}.tag.logo{background:#FFF3D1;color:#7A5600}
@media (prefers-color-scheme:dark){.tag.vencido{background:#3A1820}.tag.pagante{background:#12352A}.tag.logo{background:#3A3010;color:#F2D07A}}
.dados{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:var(--s2);margin:var(--s2) 0}
.dados div{font-size:14px;line-height:20px}.dados span{display:block;color:var(--muted);font-size:12px;line-height:16px}
.acoes{display:flex;flex-wrap:wrap;gap:var(--s2)}
.erro-item{border-top:1px solid var(--line);padding:var(--s2) 0;font-size:14px;line-height:20px;overflow-wrap:anywhere}
.erro-item:first-child{border-top:0}
.aviso{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);text-align:center}
.vazio{color:var(--muted);text-align:center;padding:var(--s4)}
#toast{position:fixed;left:50%;bottom:var(--s4);transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:var(--pill);padding:var(--s2) var(--s4);font-weight:700;display:none;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<main>
  <header>
    <div class="grow"><h1>Painel do dono</h1><div class="s" id="quando">Carregando…</div></div>
    <button class="btn mini" id="atualizar" type="button">Atualizar</button>
    <a class="btn mini" href="../">Abrir app</a>
  </header>
  <div id="conteudo"></div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="dono.js"></script>
</body>
</html>
